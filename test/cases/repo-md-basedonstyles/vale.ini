# The hazard the README warns about, kept as a snapshot so a Vale upgrade that changes it
# shows up. A BasedOnStyles line under [*.md] replaces the [*] list for Markdown files:
# doc.md loses JustSaySo and FirstDollar. STE still runs there, because the [*] STE level
# keys turn it on.
StylesPath = .vale/styles
Packages = @PACKAGE_URL@

[*.md]
BasedOnStyles = ai-tells
