# A repo with its own exceptions: a second vocabulary,
# one rule raised to error for every target, and an exempt directory.
StylesPath = .vale/styles
Packages = @PACKAGE_URL@

# Replaces the package's Vocab key. Listing FirstDollar keeps the package's vocabulary.
Vocab = FirstDollar, Local

# A level in [*] reaches every target that does not set the same key.
[*]
ai-tells.ShipOveruse = error

# An empty list disables every style for the match.
[**/archive/**]
BasedOnStyles =
