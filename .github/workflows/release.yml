# Publishes dist/fd-vale.zip as a GitHub release when a v* tag is pushed.
#
# Immutable releases are on for this repository (enabled 2026-10-26). Once a release is
# published, GitHub locks its tag and assets: nobody can re-upload fd-vale.zip under the
# same URL. A draft stays mutable, so this job creates a draft, uploads to it, and
# publishes last. A failure before the last step leaves a draft to delete, never a broken
# published release.
#
# Consumers download the zip with `vale sync`, which checks nothing. The release notes
# carry the zip's SHA-256 so a consumer's CI can verify the download itself.

name: Release

on:
  push:
    tags: ['v*']

# Only this workflow needs write access, and only to create the release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VALE_VERSION: 3.25.1
  # From vale_3.25.1_checksums.txt on the GitHub release (an immutable release).
  VALE_SHA256: 4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check below needs main's history.
          fetch-depth: 0

      # A tag is cut by whoever can push one. Requiring the tagged commit to be on main
      # means every released rule went through review.
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Vale
        run: |
          curl -sSfL -o vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf vale.tar.gz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Committed styles match upstream.json
        run: scripts/fetch-upstream.sh --check

      # Builds dist/fd-vale.zip and tests that exact file.
      - name: Snapshot tests
        run: test/run.sh

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sum=$(cut -d' ' -f1 dist/fd-vale.zip.sha256)
          cat > notes.md <<EOF
          Pin this release in a repo's \`.vale.ini\`:

          \`\`\`ini
          StylesPath = .vale/styles
          Packages = https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/fd-vale.zip
          \`\`\`

          SHA-256 of \`fd-vale.zip\`: \`${sum}\`

          \`vale sync\` does not verify downloads. To verify in CI before syncing:

          \`\`\`sh
          curl -sSfL -o fd-vale.zip https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/fd-vale.zip
          echo "${sum}  fd-vale.zip" | sha256sum -c -
          \`\`\`
          EOF
          # A 0.x tag, or a tag with a SemVer pre-release suffix such as v1.0.0-rc.1, is
          # published as a GitHub pre-release.
          prerelease=()
          case "$TAG" in v0.*|*-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft "${prerelease[@]}" --verify-tag --title "$TAG" \
            --notes-file notes.md dist/fd-vale.zip dist/fd-vale.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
