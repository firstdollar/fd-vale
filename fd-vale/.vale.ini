# fd-vale base configuration. https://github.com/firstdollar/fd-vale
#
# A repo uses this file by naming the release zip in its own .vale.ini:
#
#   StylesPath = .vale/styles
#   Packages = https://github.com/firstdollar/fd-vale/releases/download/vX.Y.Z/fd-vale.zip
#
# LAYOUT. This file follows just-say-so's layout (docs/vale.md in ifandelse/just-say-so):
# the shared styles and levels live once in [*], and each target narrows them.
#
#   [*]                    every target: Markdown, HTML, Artifact pages, replies,
#                          published text, agent instruction files
#   [*.reply]              chat replies (just-say-so lints them as reply.reply)
#   [*.publish]            published text (gh.pr.body.publish, mcp.<server>.<tool>.<field>.publish)
#   [{**/,}{AGENTS,...}.md] agent instruction files: adds Prompts
#   commit messages        their own style list
#   source code            comments only, for the types Vale parses (last sections)
#   everything else        not linted: YAML, JSON, config, unparsed source types
#
# Two Vale behaviors decide how a section narrows [*]. A level line in [*] applies in
# every narrower section unless that section sets the same key. A BasedOnStyles line in
# a narrower section replaces the [*] list instead of adding to it, so a section that
# needs an extra style repeats the whole list (test/check-config.py checks this).
#
# How Vale 3.22.0 merges this file with a repo's (verified): this file is read first,
# then the repo's. BasedOnStyles lists under the same header are combined. Every other
# key takes the repo's value. A repo adds styles and levels in its own [*], and changes
# one target in that target's section. A repo that writes BasedOnStyles under a
# narrower header, such as [*.md], replaces the [*] list for those files and drops the
# package's styles with no warning.
#
# POLICY. Prose has three targets and two kinds of gate.
#
# - Prose written to a file (Markdown, HTML, commit messages) blocks on error-level
#   alerts. The just-say-so plugin, a pre-commit hook and PR CI each enforce it on
#   added lines. An Artifact page lints as artifact.<file> with its own extension, so
#   artifact.report.html gets these rules too.
# - Text an agent publishes blocks on error-level alerts before it goes out.
# - Chat replies are scored in the background and never block. Blocking on reply errors
#   was tried first and dropped: it put friction and noise into every engineer's
#   session. Interval-based reminders were tried next and made no measurable
#   difference. just-say-so now injects the rules on the prompt after a reply breaks one.
#
# CALIBRATION. Levels below come from hits per 10k words against two pre-LLM,
# human-written baselines: Rust RFCs as of 2020-12-29 (narrative design prose) and
# Node.js v14.0.0 API docs. A rule that fires at most about 2x the RFC rate is
# matching ordinary technical register, so it runs as advice. A rule that fires 5x or
# more stays at error even when each single match reads fine, because the pattern is
# the frequency. Measured on two internal repositories, the smaller with 97k words of
# Markdown and the larger with 1.8M, first on 2026-10-09 and again on 2026-10-26.
# Ratios below give both repositories where they differ, smaller first.
#
# Requires Vale >= 3.25.1 for the JavaScript and TypeScript [formats] lines below
# (3.21.0 for Prompts, 3.17.0 for style-wide levels). The reply and
# publish sections need just-say-so >= 0.9.0; earlier versions lint chat as *.chat.md.

MinAlertLevel = suggestion

# Product names that no rule should flag. A repo that needs its own terms, such as
# partner or library names, adds a vocabulary under a different name
# (`Vocab = FirstDollar, MyRepo`). Never name it FirstDollar: `vale sync` overwrites
# StylesPath/config/vocabularies/FirstDollar with this package's copy.
Vocab = FirstDollar

# Vale picks a parser by extension and lints only types it knows. These map to the
# Markdown parser, which skips code blocks and code spans. COMMIT_EDITMSG is inert until
# a repo's commit-msg hook runs Vale. reply and publish are just-say-so's names for chat
# and published text.
[formats]
COMMIT_EDITMSG = md
reply = md
publish = md
# JavaScript and TypeScript comments parse as Markdown (Vale >= 3.25.1 for the
# .mjs/.cjs/.mts/.cts mappings). Vale then skips code spans and fences inside a
# comment, so a code example there is not linted as prose. Without these lines Vale
# reads a comment as plain text (vale-cli/vale#1208). JSDoc tags and @example blocks,
# and tool directives such as eslint-disable or @ts-ignore, are skipped by Vale itself
# from 3.23.0.
ts = md
tsx = md
mts = md
cts = md
js = md
jsx = md
mjs = md
cjs = md

# Shared rules for every target.
[*]
BasedOnStyles = ai-tells, STE, JustSaySo, FirstDollar

# STE (Simplified Technical English) runs as suggestion so the error output stays legible.
STE = suggestion
# Measured 2026-10-12 on the smaller repository's 29 Markdown files (95,559 words), sampling 12
# hits each. SentenceLength: 72.9 hits per 10k words, 12 of 12 real. PassiveVoice: 105
# per 10k, about 7 of 12 real; it cannot tell an allowed passive (unknown actor, a quoted
# test name) from a forbidden one. Both warn. FirstDollar.SentenceCap blocks past 35 words.
STE.SentenceLength = warning
STE.PassiveVoice = warning
STE.Dictionary = NO        # plain-language swap list, rewrites precise terms
STE.Gerunds = NO           # -ing forms are ordinary technical prose; 93 to 100% of files
STE.Ambiguity = NO         # treats "/" in every path and "e.g." as ambiguity
STE.ProcedureLength = NO   # caps list items at 20 words as if every bullet were a step
STE.Contractions = NO      # STE bans them; our writing rules do not

ai-tells.ColonUsage = NO   # flags the "**Label**: Sentence" list convention both repositories use on purpose

# ai-tells.EmDashUsage stays at its shipped level, error. Em-dashes fire at 99 per 10k
# words in the larger repository and 94 in the smaller, against 0.82 in the RFCs and 0.22 in the Node
# docs: about 115x the RFC rate, so the 5x rule above keeps it at error. The rule targets
# a one-character habit with no false-positive class, and the gates check added lines
# only, so legacy hits block nothing until their line changes. No section below sets
# a level for it, so it holds at error for every target.

# Ratios to the RFC rate, smaller / larger repository:
ai-tells.FormalRegister = NO               # 0.07x / 0.04x: "implementation", "terminates" are precise terms
ai-tells.FormalTransitions = warning       # 0.1x / 0.1x
ai-tells.FillerIntensifier = warning       # 0.6x / 1.5x: mostly "a single", used precisely
ai-tells.AnthropomorphicCognition = warning  # 1.0x / 0.4x
ai-tells.MortalityMetaphors = warning      # 1.1x / 0.3x: process lifetimes ("outlives", "survives a restart")
ai-tells.VerbTricolon = warning            # 1.3x / 1.3x
# These two measured higher in the larger repository. Many of its ShipOveruse hits are spec status
# labels ("Status: SHIPPED"). A repo that wants either one blocking sets it to error.
ai-tells.NounString = warning              # 1.2x / 3.1x
ai-tells.ShipOveruse = warning             # 1.8x / 8.0x

# FirstDollar.We and FirstDollar.Avoid ship at warning, SentenceCap at error and
# NobodySubject at warning. JustSaySo ships its banned list at error and Intensifiers
# (very, truly, crucial, vital) at suggestion.

# Agent instruction files at any depth (root, apps/*, packages/*, .claude/skills/*).
# Adds Prompts. A BasedOnStyles line here replaces the [*] list, so the [*] styles
# repeat. The [*] levels apply here without repeating.
[{**/,}{AGENTS,CLAUDE,SKILL}.md]
BasedOnStyles = ai-tells, STE, JustSaySo, FirstDollar, Prompts
Prompts = warning          # promoted from suggestion: 62 hits in the larger repository, zero false positives seen
# A style-wide level moves every rule, in both directions. These two ship at error and
# check hard limits with no false-positive class, so they keep it.
Prompts.Paths = error
Prompts.Frontmatter = error
STE.Modals = NO            # SHOULD / MAY are RFC 2119 keywords in instruction files

# Chat replies, linted by just-say-so as reply.reply when a repo sets reply.mode to
# "warn". Each repo starts with reply.mode "off" and turns it on when it is ready (see
# README). In warn mode just-say-so never blocks a reply. It counts the reply's
# error-level alerts and lists those rules in a report on the next prompt. Warnings and
# suggestions are left out of the report, and the events log still counts them.
#
# So an error here means "remind the agent about this rule". Nine rules stay at error:
# the habits being trained out of replies first. Every other rule drops to warning,
# which keeps it measured without filling the report (just-say-so lists at most 10
# rules). To start training a rule, raise it to error here.
#
# Measured 2026-10-28 on 666 past replies (the final reply of each turn, from local
# Claude Code transcripts, 2026-09-18 to 2026-10-28): these nine produce a reminder on
# 74.0% of replies (SentenceCap adds 0.3 points). With every [*] level in force the figure was 81.5%.
#
# A style-wide level moves every rule in the style, including rules [*] turns off, so
# each `= NO` from [*] for these styles is repeated below. test/check-config.py fails
# when one is missing. FirstDollar.We stays off: in a chat, "we" means the user and the
# agent.
[*.reply]
ai-tells = warning
JustSaySo = warning
FirstDollar = warning
ai-tells.ColonUsage = NO
ai-tells.FormalRegister = NO
FirstDollar.We = NO
ai-tells.EmDashUsage = error
ai-tells.SemicolonUsage = error
ai-tells.CataphoricForecasting = error   # "Two things to check:"
ai-tells.NegatedObject = error           # "found no errors"
ai-tells.NegatedSubject = error          # "Nothing gets blocked"
ai-tells.ContrastiveNegation = error     # "it's not X, it's Y"
ai-tells.ContrastiveFormulas = error     # "not X, but Y"
ai-tells.ExplainerHeadings = error       # "What X is", "How the pieces fit"
FirstDollar.SentenceCap = error          # a sentence over 35 words

# Published text: each field a gh command or an MCP tool sends, which just-say-so lints
# as <source>.<tool>.<field>.publish and blocks on error. Every [*] style and level
# applies. The figurative family stays at its shipped level, error. A narrower section
# such as [gh.*.title.publish] can change one field's rules.
#
# Measured 2026-10-13 on two draft PR descriptions: the publish levels refused "buried
# the" (FigurativeIdioms) and "keep their" (FigurativeKeeps), which the reply levels pass
# as warnings. They miss personified code and false claims: a draft with "forgot",
# "answered" and an untrue technical claim got 0 errors here. A description is written
# once and read by people, and a rewrite costs one more pass.
[*.publish]
# NobodySubject is a warning in documents. Published text holds it to error, as it does
# the figurative family.
FirstDollar.NobodySubject = error

# Comments in source files. Vale lints only the comments in these types and leaves the
# code alone. Every [*] style and level applies, except the rules turned off below. Measured
# 2026-10-28 on the smaller repository's 815 .ts/.tsx files (518k comment words) and a
# 1,500-file sample of the larger one's (382k), in hits per 10k comment words against
# Markdown:
#
# - DoubleHyphen: 199 / 139 in comments, against 0.4 / 0.2 in Markdown. Every sampled
#   match was a divider line such as `// -------`, which is code layout. In JS/TS the
#   [formats] mapping already parses dividers as Markdown rules; the other types still
#   read them as plain text.
# - FirstDollar.We: "we retry the call" is the ordinary voice of a comment. 1.5 / 33 in
#   comments; the RFC baseline uses "we" at 69.
#
# In JavaScript and TypeScript, [formats] above makes Vale skip code examples in
# comments. In the other types Vale reads a comment as plain text, so a code example
# there (backticks, a ``` fence) is linted as prose. SemicolonUsage stays at error
# anyway: of 1,203 semicolon hits in the measured comments, every sampled one was
# prose, and just-say-so stands its gate down after one rewrite that cannot clear an
# alert. SentenceCap and STE.SentenceLength never fire here, because Vale receives a
# wrapped comment one line at a time.
#
# Keep this extension list equal to the source part of the allow-list below
# (test/check-config.py checks it).
[*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,py,go,rb,rs,java,c,h,cc,cxx,cpp,hpp,cs,swift,scala,proto,css,scss,less,lua,r,pl,hs,jl,ex,exs}]
ai-tells.DoubleHyphen = NO
FirstDollar.We = NO
# Heading rules. With the [formats] mapping, a comment line directly above `// ---`
# or `// ===` parses as a Markdown heading, and "// How the cache works" trips
# ExplainerHeadings at error. Comments hold no real headings, so these five rules can
# only fire on that side effect. 110 such lines in the smaller repository's JS/TS, 443 in
# the larger one's.
ai-tells.AnnouncementHeadings = NO
ai-tells.ExplainerHeadings = NO
ai-tells.MarketingHeadings = NO
ai-tells.MicDropHeadings = NO
ai-tells.WrapUpHeadings = NO

# Every file that is neither prose nor a source type whose comments Vale can isolate.
# just-say-so lints every file an agent writes. Tested on Vale 3.22.0 under [*]:
#
# - Source types in this list: Vale lints the comments and leaves the code alone. In a
#   .ts file, a comment with an em-dash is flagged; the same em-dash in a string
#   literal, a template literal or an identifier is not.
# - Every other type: Vale reads the whole file as prose, code and values included.
#   That covers .sh, .sql, .kt, .vue, .svelte, .dart, and all config files (.yml,
#   .json, .toml, .env, .ini, .tf, Dockerfile, Makefile). Before Vale 3.25.1, .mjs,
#   .cjs, .mts and .cts were in this group too.
#
# This section turns every style off for those other types. An empty style list
# disables every style for the match, including styles that [*] level keys turn on. A
# repo that wants another type linted adds its own section, such as [*.txt], and lists
# every style it wants there: the [*] levels stay off for that type.
#
# just-say-so's commit gate (pre-commit and CI) lints only .md, .mdx, .markdown, .html
# and .htm. Code comments are checked when an agent writes them, and not at commit.
#
# Order matters: when two sections like these match one file, the later one wins. The
# commit-message section comes after this one so that COMMIT_EDITMSG gets its rules.
[!*.{md,mdx,markdown,html,htm,reply,publish,ts,tsx,mts,cts,js,jsx,mjs,cjs,py,go,rb,rs,java,c,h,cc,cxx,cpp,hpp,cs,swift,scala,proto,css,scss,less,lua,r,pl,hs,jl,ex,exs}]
BasedOnStyles =

# Commit messages. The glob matches both the bare name a commit-msg hook receives and
# the path a direct `vale .git/COMMIT_EDITMSG` gets. A commit message matches only this
# section's list, so the [*] list does not apply; the [*] levels do. STE is listed
# because its [*] levels would turn it on anyway, and a list that names it says so.
# The [*] ColonUsage = NO matters here too: a ticket-key subject prefix such as
# PROJ-123: is convention and would trip it.
[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits, STE
